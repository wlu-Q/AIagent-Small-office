<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="707" viewBox="0 0 1120 707" role="img" aria-labelledby="title description">
<title id="title">并行修改，用 Git worktree 分开</title><desc id="description">同一项目的独立工作使用不同目录，合并与冲突沿用原生 Git 能力。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#AABAC5" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
<rect x="1" y="1" width="1118" height="705" rx="24" fill="#FFFBF4" stroke="#E4E5DE"/>
<rect x="42" y="38" width="10" height="10" fill="#59A99F"/><rect x="57" y="38" width="10" height="10" fill="#E99B85"/><rect x="72" y="38" width="10" height="10" fill="#8BA6CF"/>
<text x="42" y="89" font-size="30" fill="#24364B" font-weight="700" text-anchor="start">并行修改，用 Git worktree 分开</text>
<text x="42" y="121" font-size="19" fill="#607387" font-weight="400" text-anchor="start">同一项目的独立工作使用不同目录，合并与冲突沿用原生 Git 能力。</text>
<path d="M 308 237 H 359 V 206 H 407" fill="none" stroke="#AABAC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 359 237 V 382 H 407" fill="none" stroke="#AABAC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 687 206 H 726 V 288 H 772" fill="none" stroke="#AABAC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 687 382 H 726 V 320 H 772" fill="none" stroke="#AABAC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 925 392 V 480" fill="none" stroke="#AABAC5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 772 352 H 741 V 533 H 687" fill="none" stroke="#AABAC5" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<rect x="42" y="186" width="266" height="106" rx="17" fill="#EDF3FD" stroke="#D5DFE5" stroke-width="1.5"/><rect x="63" y="209" width="8" height="8" rx="1" fill="#718EC4"/><text x="83" y="222" font-size="23" fill="#24364B" font-weight="650" text-anchor="start">绑定的本地项目</text><text x="64" y="254" font-size="19" fill="#607387" font-weight="400" text-anchor="start">用户当前使用的文件目录</text>
<rect x="407" y="157" width="280" height="107" rx="17" fill="#E9F5F1" stroke="#D5DFE5" stroke-width="1.5"/><rect x="428" y="180" width="8" height="8" rx="1" fill="#287E7B"/><text x="448" y="193" font-size="23" fill="#24364B" font-weight="650" text-anchor="start">员工 A · worktree</text><text x="429" y="225" font-size="19" fill="#607387" font-weight="400" text-anchor="start">在独立目录中修改文件</text>
<rect x="407" y="333" width="280" height="107" rx="17" fill="#FFF0E8" stroke="#D5DFE5" stroke-width="1.5"/><rect x="428" y="356" width="8" height="8" rx="1" fill="#D48972"/><text x="448" y="369" font-size="23" fill="#24364B" font-weight="650" text-anchor="start">员工 B · worktree</text><text x="429" y="401" font-size="19" fill="#607387" font-weight="400" text-anchor="start">并行处理另一项独立工作</text>
<rect x="772" y="218" width="306" height="174" rx="17" fill="#FFFFFF" stroke="#D5DFE5" stroke-width="1.5"/><rect x="793" y="241" width="8" height="8" rx="1" fill="#287E7B"/><text x="813" y="254" font-size="23" fill="#24364B" font-weight="650" text-anchor="start">在指定工作区内合并</text><text x="794" y="286" font-size="19" fill="#607387" font-weight="400" text-anchor="start">git merge</text><text x="794" y="313" font-size="19" fill="#607387" font-weight="400" text-anchor="start">合入所选员工成果</text><text x="794" y="340" font-size="19" fill="#607387" font-weight="400" text-anchor="start">以及用户当前文件基线</text>
<text x="943" y="442" font-size="19" fill="#287E7B" font-weight="400" text-anchor="start">合并成功</text>
<rect x="772" y="480" width="306" height="139" rx="17" fill="#E9F5F1" stroke="#D5DFE5" stroke-width="1.5"/><rect x="793" y="503" width="8" height="8" rx="1" fill="#287E7B"/><text x="813" y="516" font-size="23" fill="#24364B" font-weight="650" text-anchor="start">写回绑定项目</text><text x="794" y="548" font-size="19" fill="#607387" font-weight="400" text-anchor="start">git apply 应用文件改动</text><text x="794" y="575" font-size="19" fill="#607387" font-weight="400" text-anchor="start">保留用户原 HEAD / index</text><text x="794" y="602" font-size="19" fill="#607387" font-weight="400" text-anchor="start">按现有权限处理审批</text>
<rect x="126" y="480" width="561" height="139" rx="17" fill="#FFF5D9" stroke="#D5DFE5" stroke-width="1.5"/><rect x="147" y="503" width="8" height="8" rx="1" fill="#C69935"/><text x="167" y="516" font-size="23" fill="#24364B" font-weight="650" text-anchor="start">发生冲突：保留 Git 原生状态</text><text x="148" y="548" font-size="19" fill="#607387" font-weight="400" text-anchor="start">解决冲突后 git add，再继续处理</text><text x="148" y="575" font-size="19" fill="#607387" font-weight="400" text-anchor="start">也可以 git merge --abort 中止合并</text>
<text x="42" y="674" font-size="18" fill="#607387" font-weight="400" text-anchor="start">独立目录按需创建；直接在绑定项目中工作的员工，其原地修改无需走这条写回链。</text>
</g></svg>
